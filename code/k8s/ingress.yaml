apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: easyrent-ingress
  namespace: easyrent
spec:
  rules:
    - host: easyrent.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80